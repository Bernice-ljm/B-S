<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="92mm" viewBox="0 0 482 261" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">审批申请：从提交到可追溯终态</title>
  <desc id="fig-desc">四个主步骤在上方等距排列，三种审批结果在下方独立排列，所有连线位于卡片外部。</desc>
  <rect x="0" y="0" width="482" height="261" fill="#FFFFFF"/>

  <g id="c:heading" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <text x="16" y="22" font-size="14" font-weight="700">审批申请：从提交到可追溯终态</text>
    <text x="16" y="38" font-size="7.5">四步主路径与三种审批结果分区展示</text>
    <text x="466" y="22" text-anchor="end" font-size="7.5">流程样图 v4</text>
  </g>

  <!-- 主流程箭头：不使用 marker，避免跨渲染器放大。 -->
  <g id="e:main-path" fill="#334155" stroke="#334155" stroke-width="1.7">
    <line x1="111" y1="92" x2="127" y2="92"/><path d="M127 88 L133 92 L127 96 Z" stroke="none"/>
    <line x1="228" y1="92" x2="244" y2="92"/><path d="M244 88 L250 92 L244 96 Z" stroke="none"/>
    <line x1="345" y1="92" x2="361" y2="92"/><path d="M361 88 L367 92 L361 96 Z" stroke="none"/>
  </g>

  <g id="n:submit" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <rect x="15" y="54" width="96" height="76" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="29" cy="68" r="8" fill="#E2E8F0" stroke="none"/>
    <text x="29" y="70.8" text-anchor="middle" font-size="7.5">1</text>
    <text x="63" y="87" text-anchor="middle" font-size="9.5">提交申请</text>
    <text x="63" y="106" text-anchor="middle" font-size="7.5">身份与业务规则</text>
    <text x="63" y="119" text-anchor="middle" font-size="7.5">服务端校验</text>
  </g>

  <g id="n:workflow-snapshot" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="132" y="54" width="96" height="76" rx="5" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.2"/>
    <circle cx="146" cy="68" r="8" fill="#FFFFFF" stroke="none"/>
    <text x="146" y="70.8" text-anchor="middle" font-size="7.5" fill="#1F2937">2</text>
    <text x="180" y="87" text-anchor="middle" font-size="9.5" fill="#FFFFFF">冻结审批快照</text>
    <text x="180" y="106" text-anchor="middle" font-size="7.5" fill="#FFFFFF">模板版本 · 节点顺序</text>
    <text x="180" y="119" text-anchor="middle" font-size="7.5" fill="#FFFFFF">规则口径 · 实际审批人</text>
  </g>

  <g id="n:first-task" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <rect x="249" y="54" width="96" height="76" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="263" cy="68" r="8" fill="#E2E8F0" stroke="none"/>
    <text x="263" y="70.8" text-anchor="middle" font-size="7.5">3</text>
    <text x="297" y="87" text-anchor="middle" font-size="9.5">生成首个待办</text>
    <text x="297" y="106" text-anchor="middle" font-size="7.5">激活第一审批节点</text>
    <text x="297" y="119" text-anchor="middle" font-size="7.5">通知实际审批人</text>
  </g>

  <g id="n:current-approval" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <rect x="366" y="54" width="101" height="76" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="380" cy="68" r="8" fill="#E2E8F0" stroke="none"/>
    <text x="380" y="70.8" text-anchor="middle" font-size="7.5">4</text>
    <text x="416.5" y="87" text-anchor="middle" font-size="9.5">当前节点审批</text>
    <text x="416.5" y="106" text-anchor="middle" font-size="7.5">校验节点与操作者</text>
    <text x="416.5" y="119" text-anchor="middle" font-size="7.5">批准 / 填写理由后驳回</text>
  </g>

  <!-- 分支总线仅占用两行卡片间的空白区域。 -->
  <g id="e:result-bus" fill="none" stroke="#475569" stroke-width="1.35">
    <path d="M416.5 130 V151 H111.5"/>
    <line x1="111.5" y1="151" x2="370.5" y2="151"/>
    <line x1="111.5" y1="151" x2="111.5" y2="168"/>
    <line x1="241" y1="151" x2="241" y2="168"/>
    <line x1="370.5" y1="151" x2="370.5" y2="168"/>
  </g>
  <g id="e:result-arrows" fill="#475569">
    <path d="M107.5 168 L111.5 174 L115.5 168 Z"/>
    <path d="M237 168 L241 174 L245 168 Z"/>
    <path d="M366.5 168 L370.5 174 L374.5 168 Z"/>
  </g>

  <g id="n:next-task" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <rect x="55" y="174" width="113" height="50" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="111.5" y="194" text-anchor="middle" font-size="9.5">下一节点</text>
    <text x="111.5" y="211" text-anchor="middle" font-size="7.5">仍有节点：生成待办并继续审批</text>
  </g>

  <g id="n:approved" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <rect x="184.5" y="174" width="113" height="50" rx="5" fill="#ECFDF5" stroke="#86C7A5" stroke-width="1"/>
    <text x="241" y="194" text-anchor="middle" font-size="9.5">已通过</text>
    <text x="241" y="211" text-anchor="middle" font-size="7.5">最后节点批准：进入终态</text>
  </g>

  <g id="n:rejected" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <rect x="314" y="174" width="113" height="50" rx="5" fill="#FEF2F2" stroke="#E3A1A1" stroke-width="1"/>
    <text x="370.5" y="194" text-anchor="middle" font-size="9.5">已驳回</text>
    <text x="370.5" y="211" text-anchor="middle" font-size="7.5">任一节点驳回：理由必填</text>
  </g>

  <g id="c:transaction-boundary" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1F2937">
    <rect x="55" y="237" width="372" height="18" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="241" y="249.5" text-anchor="middle" font-size="7.5">一致提交：申请状态 ｜ 当前待办 ｜ 审批日志 ｜ 通知事件</text>
  </g>
</svg>
