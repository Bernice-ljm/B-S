<text x="241.0" y="285" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#FFFFFF">申请实例快照</text>
<text x="241.0" y="303" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#FFFFFF">节点顺序固定</text>
<text x="241.0" y="316" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#FFFFFF">规则与人员固定</text>
<rect x="319" y="270" width="118" height="48" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<text x="378.0" y="293" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">后续模板 v4</text>
<text x="378.0" y="311" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">只影响新申请</text>
<line x1="163" y1="294" x2="176" y2="294" stroke="#667784" stroke-width="1.6"/>
<path d="M176 290 L182 294 L176 298 Z" fill="#667784" stroke="none"/>
