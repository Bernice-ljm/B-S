<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="123.44mm" viewBox="0 0 482 350" role="img">
<title>设计亮点：提交时解析并冻结审批路径</title>
<rect x="0" y="0" width="482" height="350" fill="#FFFFFF"/>
