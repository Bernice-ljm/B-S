<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="102.99mm" viewBox="0 0 482 292" role="img">
<title>自定义流程模板生命周期</title>
<rect x="0" y="0" width="482" height="292" fill="#FFFFFF"/>
<text x="16" y="22" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#243747">自定义流程模板生命周期</text>
<text x="16" y="38" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">发布产生不可变版本；编辑已发布模板会创建新版本</text>
<rect x="15" y="62" width="76" height="62" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<circle cx="29" cy="76" r="8" fill="#D9D7D3" stroke="none" stroke-width="0"/>
<text x="29" y="78.8" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">1</text>
<text x="53.0" y="95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">草稿模板</text>
<text x="53.0" y="113" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">名称 / 部门</text>
<line x1="91" y1="93" x2="99" y2="93" stroke="#667784" stroke-width="1.6"/>
<path d="M99 89 L105 93 L99 97 Z" fill="#667784" stroke="none"/>
<rect x="105" y="62" width="76" height="62" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<circle cx="119" cy="76" r="8" fill="#D9D7D3" stroke="none" stroke-width="0"/>
<text x="119" y="78.8" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">2</text>
<text x="143.0" y="95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">配置字段</text>
<text x="143.0" y="113" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">类型 / 必填</text>
<line x1="181" y1="93" x2="189" y2="93" stroke="#667784" stroke-width="1.6"/>
<path d="M189 89 L195 93 L189 97 Z" fill="#667784" stroke="none"/>
<rect x="195" y="62" width="76" height="62" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<circle cx="209" cy="76" r="8" fill="#D9D7D3" stroke="none" stroke-width="0"/>
<text x="209" y="78.8" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">3</text>
<text x="233.0" y="95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">配置节点</text>
<text x="233.0" y="113" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">顺序 / 审批人</text>
<line x1="271" y1="93" x2="279" y2="93" stroke="#667784" stroke-width="1.6"/>
<path d="M279 89 L285 93 L279 97 Z" fill="#667784" stroke="none"/>
<rect x="285" y="62" width="76" height="62" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<circle cx="299" cy="76" r="8" fill="#D9D7D3" stroke="none" stroke-width="0"/>
<text x="299" y="78.8" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">4</text>
<text x="323.0" y="95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">发布校验</text>
<text x="323.0" y="113" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">字段与规则</text>
<line x1="361" y1="93" x2="369" y2="93" stroke="#667784" stroke-width="1.6"/>
<path d="M369 89 L375 93 L369 97 Z" fill="#667784" stroke="none"/>
<rect x="375" y="62" width="76" height="62" rx="5" fill="#2C6AA5" stroke="#1F4F7D" stroke-width="1.1"/>
<circle cx="389" cy="76" r="8" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="389" y="78.8" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">5</text>
<text x="413.0" y="95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#FFFFFF">不可变版本</text>
<text x="413.0" y="113" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#FFFFFF">员工可发起</text>
<rect x="70" y="176" width="100" height="52" rx="5" fill="#FCF1E3" stroke="#D88C27" stroke-width="1.1"/>
<text x="120.0" y="199" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">校验失败</text>
<text x="120.0" y="217" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">定位字段或节点</text>
<rect x="191" y="176" width="100" height="52" rx="5" fill="#EDF3E9" stroke="#64894D" stroke-width="1.1"/>
<text x="241.0" y="199" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">修改产生 v2</text>
<text x="241.0" y="217" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">旧版本仍可追溯</text>
<rect x="312" y="176" width="100" height="52" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<text x="362.0" y="199" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">停用模板</text>
<text x="362.0" y="217" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">不接收新申请</text>
<path d="M323 124 V150 H120 V176" fill="none" stroke="#667784" stroke-width="1.35"/>
<path d="M413 124 V150 H241 V176" fill="none" stroke="#667784" stroke-width="1.35"/>
<path d="M451 124 V160 H362 V176" fill="none" stroke="#667784" stroke-width="1.35"/>
<rect x="85" y="253" width="312" height="24" rx="4" fill="#EDF3E9" stroke="#64894D" stroke-width="1"/>
<text x="241.0" y="267.8" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">实例始终保存发布版本与实际审批路径快照</text>
</svg>