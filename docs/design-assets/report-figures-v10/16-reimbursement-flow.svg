<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="100.87mm" viewBox="0 0 482 286" role="img">
<title>报销金额与附件闭环</title>
<rect x="0" y="0" width="482" height="286" fill="#FFFFFF"/>
<text x="16" y="22" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#243747">报销金额与附件闭环</text>
<text x="16" y="38" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">关联申请、费用明细与票据在服务端统一校验</text>
<rect x="15" y="58" width="104" height="54" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<text x="67.0" y="81" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">费用明细</text>
<text x="67.0" y="99" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">类型 · 日期 · 用途 · 金额</text>
<rect x="15" y="132" width="104" height="54" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<text x="67.0" y="155" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">票据资料</text>
<text x="67.0" y="173" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">文件或无票例外原因</text>
<rect x="140" y="88" width="104" height="66" rx="5" fill="#2C6AA5" stroke="#1F4F7D" stroke-width="1.1"/>
<text x="192.0" y="111" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#FFFFFF">服务端校验</text>
<text x="192.0" y="129" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#FFFFFF">关联申请权限 / 状态</text>
<text x="192.0" y="142" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#FFFFFF">票据归属与重复</text>
<path d="M119 85 H130 V108 H140" fill="none" stroke="#667784" stroke-width="1.35"/>
<path d="M119 159 H130 V134 H140" fill="none" stroke="#667784" stroke-width="1.35"/>
<rect x="265" y="88" width="92" height="66" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<text x="311.0" y="111" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">精确合计</text>
<text x="311.0" y="129" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">整数分 / Decimal</text>
<text x="311.0" y="142" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">同单票据去重</text>
<line x1="244" y1="121" x2="259" y2="121" stroke="#667784" stroke-width="1.6"/>
<path d="M259 117 L265 121 L259 125 Z" fill="#667784" stroke="none"/>
<rect x="378" y="58" width="89" height="54" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<text x="422.5" y="81" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">审批快照</text>
<text x="422.5" y="99" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">固定路径与金额</text>
<rect x="378" y="132" width="89" height="54" rx="5" fill="#F8FAFB" stroke="#BCC7CF" stroke-width="1.1"/>
<text x="422.5" y="155" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#243747">财务审核</text>
<text x="422.5" y="173" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">突出无票例外</text>
<path d="M357 105 H368 V85 H378" fill="none" stroke="#667784" stroke-width="1.35"/>
<path d="M422 112 V132" fill="none" stroke="#667784" stroke-width="1.35"/>
<rect x="97" y="224" width="288" height="30" rx="4" fill="#EDF3E9" stroke="#64894D" stroke-width="1"/>
<text x="241.0" y="241.8" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#243747">附件预览 / 下载：先校验当前用户对所属报销单的访问权限</text>
</svg>